plugins {
    id 'java'
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id "com.github.node-gradle.node" version "7.1.0"
    id 'com.gradleup.shadow' version '9.4.2'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.5"
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    implementation("io.javalin:javalin:7.2.2")
}

shadowJar {
    relocate 'io.javalin', 'dev.electricsteve.statisticsbrowser.shadow.javalin'
    relocate 'org.eclipse.jetty', 'dev.electricsteve.statisticsbrowser.shadow.jetty'
}

node {
    version = "20.14.0"
    download = true
    nodeProjectDir = file("web/")
    npmInstallCommand = "ci"
}

tasks.register('buildWebapp', NpmTask) {
    dependsOn("npmInstall")
    args = ["run", "build"]
    inputs.dir("web/")
    outputs.dir("web/dist/")
}

tasks.register('moveWebapp', Copy) {
    dependsOn("buildWebapp")
    from("web/dist/")
    into("src/main/resources/web/")
}

tasks.processResources {
    dependsOn("moveWebapp")
}

tasks.sourcesJar {
    dependsOn("buildWebapp")
}

tasks.clean {
    doFirst {
        delete("web/dist/")
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
